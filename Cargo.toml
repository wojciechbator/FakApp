[package]
name = "fakap"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
description = "FakApp — a small watchdog that emails you when virya-crowdrelay is down"

[dependencies]
anyhow = "1.0"
axum = "0.8.9"
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "smtp-transport",
    "tokio1",
    "tokio1-rustls-tls",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "http2",
    "json",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["formatting", "local-offset", "serde"] }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
