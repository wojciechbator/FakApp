name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fakap-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Same recipes a developer runs locally; no second copy of the gates.
      - run: just check

  # deploy.sh ships a static musl binary; build it (no tests) so a cross
  # regression is caught in CI instead of at deploy time.
  musl-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          targets: x86_64-unknown-linux-musl
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2
        with:
          tool: cargo-zigbuild
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # main @ 2026-01-19
        with:
          version: 0.15.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo zigbuild --locked --release --target x86_64-unknown-linux-musl

  # Publish the exact musl binary as a GitHub Actions artifact on every main
  # push. deploy.sh downloads it by SHA, so the binary running in production is
  # bit-for-bit identical to the one CI produced — no local toolchain drift.
  publish:
    needs: musl-smoke
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          targets: x86_64-unknown-linux-musl
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2
        with:
          tool: cargo-zigbuild
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # main @ 2026-01-19
        with:
          version: 0.15.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo zigbuild --locked --release --target x86_64-unknown-linux-musl
      - name: Stage release artifact
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/fakap \
            "dist/fakap-${GITHUB_SHA}-linux-amd64"
          file "dist/fakap-${GITHUB_SHA}-linux-amd64" | grep -q 'statically linked'
      - uses: actions/upload-artifact@v4
        with:
          name: fakap-binary-${{ github.sha }}
          path: dist/fakap-${{ github.sha }}-linux-amd64
          if-no-files-found: error
          retention-days: 90

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2
        with:
          tool: cargo-audit
      - run: cargo audit
